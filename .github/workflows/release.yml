name: Release

on:
  push:
    branches:
      - main
  # Re-runs the release when GitHub drops the push event of a merge, which
  # leaves no run to re-run.
  workflow_dispatch:

jobs:
  release:
    uses: centralnicgroup-opensource/rtldev-middleware-shareable-workflows/.github/workflows/semantic-release-plugins-release.yml@main
    secrets: inherit
